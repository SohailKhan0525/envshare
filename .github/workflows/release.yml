name: release

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_tag.outputs.tag_name }}
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine and bump version tag
        id: get_tag
        run: |
          set -e
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            echo "Triggered by tag: $TAG"
          else
            git fetch --tags --force || true
            LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -n 1)
            if [ -z "$LATEST_TAG" ]; then
              TAG="v1.0.0"
            else
              VERSION_NO_V=$(echo "$LATEST_TAG" | sed 's/^v//')
              IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NO_V"
              MAJOR=${MAJOR:-1}
              MINOR=${MINOR:-0}
              PATCH=${PATCH:-0}

              COMMIT_MSG=$(git log -1 --pretty=%B)
              if echo "$COMMIT_MSG" | grep -iq "\[major\]"; then
                MAJOR=$((MAJOR + 1))
                MINOR=0
                PATCH=0
              elif echo "$COMMIT_MSG" | grep -iq "\[minor\]"; then
                MINOR=$((MINOR + 1))
                PATCH=0
              else
                PATCH=$((PATCH + 1))
              fi
              TAG="v${MAJOR}.${MINOR}.${PATCH}"
            fi

            echo "Bumping version to $TAG"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" || true
            git push origin "$TAG" || true
          fi
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT

  build:
    needs: bump-version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - system: linux
            chip: amd64
            ending: ""
          - system: windows
            chip: amd64
            ending: ".exe"
          - system: darwin
            chip: amd64
            ending: ""
          - system: darwin
            chip: arm64
            ending: ""
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Download dependencies
        run: go mod tidy

      - name: Build the programs for this system
        env:
          GOOS: ${{ matrix.system }}
          GOARCH: ${{ matrix.chip }}
        run: |
          mkdir -p dist
          go build -o dist/envshare.${{ matrix.system }}.${{ matrix.chip }}${{ matrix.ending }} ./cmd/envshare
          go build -o dist/envshare.server.${{ matrix.system }}.${{ matrix.chip }}${{ matrix.ending }} ./cmd/envshare-server

      - name: Save this build
        uses: actions/upload-artifact@v4
        with:
          name: build.${{ matrix.system }}.${{ matrix.chip }}
          path: dist/*

  publish:
    needs: [bump-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Collect every build
        uses: actions/download-artifact@v4
        with:
          path: collected

      - name: Put every file in one folder
        run: |
          mkdir -p ready
          find collected -type f -exec cp {} ready/ \;

      - name: Publish a GitHub release with these files attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bump-version.outputs.tag_name }}
          name: Release ${{ needs.bump-version.outputs.tag_name }}
          files: ready/*
          generate_release_notes: true

