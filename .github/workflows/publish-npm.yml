name: publish to npm

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: npm
    steps:
      - name: Get the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node and point it at the npm registry
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync package version with tag or release
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG_NAME="${{ github.event.release.tag_name }}"
          else
            git fetch --tags --force || true
            TAG_NAME=$(git tag -l "v*" --sort=-v:refname | head -n 1)
          fi
          VERSION="${TAG_NAME#v}"
          if [ -n "$VERSION" ]; then
            echo "Setting package version to $VERSION"
            npm version "$VERSION" --no-git-tag-version || true
          fi

      - name: Publish the package with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NpmToken }}


